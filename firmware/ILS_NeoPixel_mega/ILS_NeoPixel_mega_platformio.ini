	${env_ILS_NeoPixel_mega.build_flags}
	'-DMOBIFLIGHT_TYPE="ILS_NeoPixel_mega ILS_NeoPixel_mega Micro"'
	'-DMOBIFLIGHT_NAME="ILS_NeoPixel_mega ILS_NeoPixel_mega"'
	-DMEMLEN_CONFIG=440
	-DMEMLEN_NAMES_BUFFER=350
	-DMF_MAX_DEVICEMEM=470
build_unflags =
	-DMF_STEPPER_SUPPORT
build_src_filter =
	${env.build_src_filter}
	${env_ILS_NeoPixel_mega.build_src_filter}
lib_deps =
	${env.lib_deps}
	${env.custom_lib_deps_Atmel}
	${env_ILS_NeoPixel_mega.lib_deps}
monitor_speed = 115200
extra_scripts =
	${env.extra_scripts}
custom_core_firmware_version = ${env_ILS_NeoPixel_mega.custom_core_firmware_version}
custom_community_project = ${env_ILS_NeoPixel_mega.custom_community_project}
custom_source_folder = ${env_ILS_NeoPixel_mega.custom_source_folder}
custom_zip_filename = ${env_ILS_NeoPixel_mega.custom_zip_filename}

