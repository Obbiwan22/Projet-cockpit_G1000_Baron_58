; ******************************************************************************************
; ILS_NeoPixel_mega_platformio.ini
;
; Configuration PlatformIO pour le firmware custom MobiFlight
; Barre LED ILS WS2812B – Arduino Mega 2560 Pro Mini
;
; Description :
;   Compile le firmware MobiFlight avec le custom device ILS NeoPixel
;   qui pilote deux rubans WS2812B de 9 LEDs chacun :
;     - Barre LOC (Localizer horizontal) sur pin D6
;     - Barre GS  (Glideslope vertical)  sur pin D7
;
;   Le firmware inclut FastLED pour la gestion des WS2812B et
;   un timeout d'extinction automatique (3s sans données).
;
; Auteur  : francois.colas22
; Projet  : Cockpit G1000 – Beechcraft Baron 58 – MSFS 2024
; Licence : MIT
; Version : 1.0.2
; ******************************************************************************************

; Common build settings across this custom device
[env_ILS_NeoPixel_mega]
build_flags =
	${env.build_flags}												; include standard build flags
	-DMF_CUSTOMDEVICE_SUPPORT=1										; Required for Custom Devices
	-DMF_CUSTOMDEVICE_HAS_UPDATE									; update() appelé dans loop() pour gérer le timeout d'extinction
	;-DMF_CUSTOMDEVICE_POLL_MS=10 									; time in ms between updating custom device, uncomment this if custom device needs to be updated regulary
	;-DHAS_CONFIG_IN_FLASH											; undefine this and add your configuration to MFCustomDevicesConfig.h to save the config in Flash !!Core FW version must be at least 2.5.2!!
	;-DREVERSED_OUTPUT_OUTPUT										; for reversed output logic on outputs
	;-DREVERSED_OUTPUT_OUTPUTSHIFTER								; for reversed output logic on outputshifter
	;-DDEBUG2CMDMESSENGER											; uncomment this to get debug messages for the connector log
	-I./src/src/MF_CustomDevice										; don't change this one!
	-I./ILS_NeoPixel_mega											; Include files for your custom device
build_src_filter =
	+<../ILS_NeoPixel_mega>											; build files for your custom device
lib_deps =
	fastled/FastLED @ ^3.6.0										; Librairie FastLED pour WS2812B
custom_core_firmware_version = 3.0.0								; define the version from the core firmware files your build should base on
custom_source_folder = ILS_NeoPixel_mega							; path to your Custom Device Sources
custom_community_project = ILS_NeoPixel_mega_ILS_NeoPixel_mega		; Folder name inside zip file
custom_zip_filename = ${env_ILS_NeoPixel_mega.custom_community_project}	; Name of the zip-file

; ─────────────────────────────────────────────────────────────
; Build settings pour Arduino Mega 2560 Pro Mini
; C'est la cible principale pour ce projet
; ─────────────────────────────────────────────────────────────
[env:ils_neopixel_mega_ils_neopixel_mega_mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags =
	${env_ILS_NeoPixel_mega.build_flags}							; don't change this one!
	'-DMOBIFLIGHT_TYPE="ILS_NeoPixel_mega"'							; doit correspondre à MobiFlightType dans le board.json
	'-DMOBIFLIGHT_NAME="ILS NeoPixel Mega 1.0.2"'							; nom affiché dans MobiFlight Connector
	-DMEMLEN_CONFIG=1496											; max. size for config which wil be stored in EEPROM
	-DMEMLEN_NAMES_BUFFER=1000										; max. size for configBuffer, contains only names from inputs
	-DMF_MAX_DEVICEMEM=1600											; max. memory size for devices
build_unflags =
	;-DMF_STEPPER_SUPPORT											; décommenter pour désactiver le support stepper
build_src_filter =
	${env.build_src_filter}											; don't change this one!
	${env_ILS_NeoPixel_mega.build_src_filter}						; don't change this one!
lib_deps =
	${env.lib_deps}													; don't change this one!
	${env.custom_lib_deps_Atmel}									; don't change this one!
	${env_ILS_NeoPixel_mega.lib_deps}								; FastLED inclus ici
monitor_speed = 115200												; don't change this one!
extra_scripts =
	${env.extra_scripts}											; don't change this one!
custom_core_firmware_version = ${env_ILS_NeoPixel_mega.custom_core_firmware_version}	; don't change this one!
custom_community_project = ${env_ILS_NeoPixel_mega.custom_community_project}			; don't change this one!
custom_source_folder = ${env_ILS_NeoPixel_mega.custom_source_folder}					; don't change this one!
custom_zip_filename = ${env_ILS_NeoPixel_mega.custom_zip_filename}						; don't change this one!

; ─────────────────────────────────────────────────────────────
; Build settings pour Arduino Pro Micro
; Non utilisé pour ce projet mais conservé pour compatibilité
